<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="dmGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5e57"></stop>
      <stop offset="100%" stop-color="#8c7ae6"></stop>
    </linearGradient>

    <style>
      .bg {
        fill: #1e1e24;
      }

      .text {
        fill: #f8f9fa;
      }

      @media (prefers-color-scheme: light) {
        .bg {
          fill: #ffffff;
        }

        .text {
          fill: #0f172a;
        }
      }
    </style>
  </defs>

  <rect class="bg" width="64" height="64" rx="16"></rect>

  <circle cx="32" cy="32" r="25" fill="none" stroke="url(#dmGradient)" stroke-width="4"></circle>

  <text class="text" x="32" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700">
    DM
  </text>
</svg>